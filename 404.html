@media(prefers-reduced-motion:no-preference){
.not-found__cat{animation:swing 4.2s ease-in-out infinite;transform-origin:52% 0}
@keyframes swing{0%,100%{transform:translateX(-50%) rotate(-2deg)}50%{transform:translateX(-50%) rotate(2deg)}}
}
